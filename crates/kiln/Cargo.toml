[package]
name = "kiln"
version = "0.0.1"
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Kiln terminal app"

[dependencies]
anyhow.workspace = true
env_logger.workspace = true
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Updates: signed release manifests over HTTPS (the only network use).
kiln_update.workspace = true
toml = "0.9"
# Settings writes kiln.toml without touching the user's comments or other keys.
toml_edit = "0.25"
gpui.workspace = true
# The local time of day ("pinned · 09:41").
jiff = "0.2"
kiln_term.workspace = true
log.workspace = true
# The custom app icon: PNG and JPEG only (already in the tree through gpui).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico"] }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-fancy", "parsing"] }

[target.'cfg(target_os = "macos")'.dependencies]
# font-kit: text rendering (off by default in gpui_macos).
# runtime_shaders: compile Metal shaders at startup, so it builds without full Xcode.
gpui_platform = { workspace = true, features = ["font-kit", "runtime_shaders"] }
# Reduce motion (the flame holds still); the Dock icon (app_icon.rs).
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSAccessibility", "NSApplication", "NSResponder", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

[target.'cfg(target_os = "windows")'.dependencies]
gpui_platform.workspace = true
# The window icon (app_icon.rs).
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { workspace = true, features = ["wayland", "x11"] }
# The window icon under X11 (app_icon.rs).
png = "0.18"
raw-window-handle = "0.6"
x11rb = "0.13"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[target.'cfg(windows)'.build-dependencies]
# The app icon inside kiln.exe (build.rs).
winresource = { version = "0.1", default-features = false }

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_platform = { workspace = true, features = ["font-kit", "runtime_shaders", "test-support"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
gpui_platform = { workspace = true, features = ["test-support"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui_platform = { workspace = true, features = ["wayland", "x11", "test-support"] }

# Installers, built with cargo-packager (https://github.com/crabnebula-dev/cargo-packager).
# Run scripts/package.sh (or see .github/workflows/release.yml). Paths are relative to this file;
# the version is this package's.
[package.metadata.packager]
productName = "Kiln"
identifier = "dev.kiln.Kiln"
description = "A calm, cross-platform terminal"
longDescription = "Kiln shows each command as a block, keeps the shell's own line editor, and copies output in a paste-ready form."
category = "DeveloperTool"
authors = ["Kiln"]
publisher = "Kiln"
icons = ["../../assets/icon/kiln.icns", "../../assets/icon/kiln.ico", "../../assets/icon/kiln-*.png"]
outDir = "../../target/packages"
beforePackagingCommand = "cargo build --profile dist --locked -p kiln"
binaries = [{ path = "kiln", main = true }]
# Licences that must travel with the app (scripts/package.sh writes the first one).
resources = [
  "../../LICENSE-MIT",
  "../../LICENSE-APACHE",
  "../../target/THIRD_PARTY_LICENSES.md",
  "../../assets/fonts/JetBrainsMono-OFL.txt",
  "../../assets/fonts/NerdFonts-LICENSE",
  "../../assets/themes/THEME-LICENSES.md",
]

[package.metadata.packager.macos]
minimumSystemVersion = "13.0"
# Ad hoc signature: no Apple Developer account. The release workflow swaps in a Developer ID
# when the signing secrets exist (and notarises then).
signingIdentity = "-"

[package.metadata.packager.nsis]
# Per-user install: no administrator rights needed, and the updater can replace it quietly.
installMode = "currentUser"
# Without it the installer shows NSIS's default icon.
installerIcon = "../../assets/icon/kiln.ico"
appdataPaths = ["$LOCALAPPDATA/Kiln"]

[package.metadata.packager.deb]
section = "x11"
depends = [
  "libfontconfig1",
  "libfreetype6",
  "libvulkan1",
  "libwayland-client0",
  "libx11-xcb1",
  "libxcb1",
  "libxkbcommon0",
  "libxkbcommon-x11-0",
]
