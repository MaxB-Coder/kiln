[package]
name = "kiln_term"
version = "0.0.1"
edition.workspace = true
publish.workspace = true
description = "Kiln's terminal session: shell, PTY loop, engine and input encoding. No UI code."

[dependencies]
alacritty_terminal.workspace = true
anyhow.workspace = true
log.workspace = true
# Same major version alacritty_terminal uses; the PTY registers with our Poller.
polling = "3"
# Processes under each shell (context rail) and the ports they listen on.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
listeners = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
