<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Kiln: a kiln's arch with the prompt glowing inside. macOS icon grid: 824 px body. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#32302f"/>
      <stop offset="1" stop-color="#1d2021"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.78" r="0.62">
      <stop offset="0" stop-color="#e07b39" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#e07b39" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#e07b39" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)"/>
  <!-- The arch opening -->
  <path d="M292 760 V520 a220 220 0 0 1 440 0 V760 Z" fill="#282828"/>
  <path d="M292 760 V520 a220 220 0 0 1 440 0 V760 Z" fill="url(#glow)"/>
  <path d="M292 760 V520 a220 220 0 0 1 440 0 V760" fill="none" stroke="#504945" stroke-width="28" stroke-linejoin="round"/>
  <!-- Hearth line -->
  <rect x="236" y="752" width="552" height="28" rx="14" fill="#504945"/>
  <!-- The prompt: chevron and cursor -->
  <path d="M410 560 L490 620 L410 680" fill="none" stroke="#e07b39" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="530" y="652" width="104" height="36" rx="18" fill="#ebdbb2"/>
</svg>
