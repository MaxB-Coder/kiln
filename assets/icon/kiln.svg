<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Kiln: a kiln's arch with the prompt flame burning inside (icon concept A, "Fired").
       macOS icon grid: 824 px body centred on 1024. The flame is frame 1 of
       assets/flame (the prompt's own flame), so the icon and the input box match. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34302d"/>
      <stop offset="1" stop-color="#1d1b1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e07b39" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e07b39" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)"/>
  <ellipse cx="512.0" cy="688.6" rx="235.4" ry="215.8" fill="url(#glow)"/>
  <path d="M325.6 786.7 V482.6 A186.4 186.4 0 0 1 698.4 482.6 V786.7"
        fill="none" stroke="#5a524c" stroke-width="39.2" stroke-linecap="round"/>
