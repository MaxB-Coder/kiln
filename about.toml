# cargo-about: the licence texts of every crate in Kiln's binary, for the installers.
# scripts/package.sh writes target/THIRD_PARTY_LICENSES.md from about.hbs. Keep the list in
# step with deny.toml.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
targets = ["aarch64-apple-darwin", "x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Kiln's own crates (unpublished) are not third-party.
private = { ignore = true }
