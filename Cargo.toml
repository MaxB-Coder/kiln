[workspace]
resolver = "3"
members = ["crates/kiln", "crates/kiln_term"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
log = "0.4"
env_logger = "0.11"
kiln_term = { path = "crates/kiln_term" }

# The terminal engine. Stays an unmodified crates.io dependency so security
# fixes arrive as version bumps.
alacritty_terminal = "0.26"

# GPUI is not published to crates.io in step with Zed (crates.io `gpui` stops at
# 0.2.2, 2025-10). Pin the official repo by commit; Renovate bumps the rev.
gpui = { git = "https://github.com/zed-industries/zed", rev = "56934ec0560bce8929025497411de7f5322fb6ca" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "56934ec0560bce8929025497411de7f5322fb6ca" }

# Zed's workspace patches do not apply to a git dependency, so the ones GPUI's
# dependency graph needs are repeated here. Keep in sync with zed/Cargo.toml.
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }

[profile.dev]
# GPUI is slow unoptimised; keep our code debuggable but deps fast.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"


# Installers (scripts/package.sh): release without the debug line tables, which nearly
# doubled the Linux packages. Symbol names stay, so crash backtraces still name functions.
[profile.dist]
inherits = "release"
strip = "debuginfo"